<!DOCTYPE html>
<html>
<head>
<title>Student Registration Form</title>
<style>
  body{ background:rgb(240, 202, 245); font-family: Arial; }
  h2{ text-align:center; color:#000080; }
  table{ margin:auto; }
  td{ padding:6px; }
  input, select, textarea{ border:1px solid rgb(3, 20, 98); padding:3px; }
</style>
</head>
<body>

<h2>Student Registration Form</h2>

<form>
<table>

<tr>
<td>Roll no. :</td>
<td><input type="text" size="35"></td>
</tr>

<tr>
<td>Student name :</td>
<td><input type="text" placeholder="First Name" size="12"> - <input type="text" placeholder="Last Name" size="12"></td>
</tr>

<tr>
<td>Father's name :</td>
<td><input type="text" size="35"></td>
</tr>

<tr>
<td>Date of birth :</td>
<td><input type="text" placeholder="Day" size="3"> - <input type="text" placeholder="Month" size="4"> - <input type="text" placeholder="Year" size="3"> (DD-MM-YYYY)</td>
</tr>

<tr>
<td>Mobile no. :</td>
<td><select><option>+91</option></select> - <input type="text" size="25"></td>
</tr>

<tr>
<td>Email id :</td>
<td><input type="email" size="35"></td>
</tr>

<tr>
<td>Password :</td>
<td><input type="password" size="35"></td>
</tr>

<tr>
<td>Gender :</td>
<td><input type="radio" name="g"> Male <input type="radio" name="g"> Female</td>
</tr>

<tr>
<td>Department :</td>
<td><input type="checkbox"> CSE <input type="checkbox"> IT <input type="checkbox"> ECE <input type="checkbox"> Civil</td>
</tr>

<tr>
<td>Course :</td>
<td>
<select>
<option>---------------- Select Current Course's ----------------</option>
<option>B.Tech</option>
<option>BCA</option>
<option>MCA</option>
<option>BSc</option>
</select>
</td>
</tr>

<tr>
<td>Student photo :</td>
<td><input type="file"></td>
</tr>

<tr>
<td>City :</td>
<td><input type="text" size="35"></td>
</tr>

<tr>
<td>Address :</td>
<td><textarea rows="3" cols="34"></textarea></td>
</tr>

<tr>
<td></td>
<td><br><input type="submit" value="Register"></td>
</tr>

</table>

<script src="trial.js"></script>
<!-- </form>  -->
</body>
</html>
